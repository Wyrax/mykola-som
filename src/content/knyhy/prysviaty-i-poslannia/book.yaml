title: "Присвяти і послання"
subtitle: "Поезії"
kind: "poetry"
order: 11
year: 1983
description: "У новій збірці відомого українського радянського поета, автора багатьох пісень — вірші про надію і тривогу, про любов і розлуку, про радість і горе. Ця вистраждана тема особливо сильно звучить у циклі «Хроніка воєнного дитинства». Мова поета дзвінка і чиста, відчувається чудове знання живих джерел народних дум."
sectionEpigraphs:
  "Хроніка воєнного дитинства":
    - text: "„І мертвим,\nі живим,\nі ненародженим...“"
      source: "Тарас Шевченко"
  "Присвяти і послання":
    - text: "Моє життя,\nнемов дитя,—\nТо плаче,\nто сміється..."

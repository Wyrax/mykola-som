title: "З матір’ю на самоті"
subtitle: "Публіцистичне видання"
kind: "prose"
order: 19
year: 2005
description: "Розмова Миколи Сома з Ганною Федорівною Симоненко-Щербань, матір’ю Василя Симоненка. До книжки ввійшли також спогади і вірші про поета, стенограма обговорення перших збірок Василя Симоненка й Миколи Вінграновського та листи матері до Миколи Сома."

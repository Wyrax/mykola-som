title: "Сто епітафій"
subtitle: "Сатира і гумор"
kind: "poetry"
order: 13
year: 1998
description: "Відомий український поет-шістдесятник Микола Сом, знаний як ніжний лірик і чарівний пісняр, виступає у досить незвичному для нього амплуа дотепного гумориста і гострого сатирика. Жанр — епітафії (в перекладі з грецької — надгробний напис), присвячені... живим. І це — дуже серйозно."

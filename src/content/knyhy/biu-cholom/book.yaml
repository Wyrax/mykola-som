title: "Б’ю чолом!"
subtitle: "Лірика та гумор"
kind: "poetry"
order: 4
year: 1978
description: "Ліричний голос Миколи Сома давно відомий шанувальникам поетичного слова. Поет залишається вірним своїй манері і в новій книзі «Б’ю чолом». В основу її лягли враження від зустрічі з трудівниками полів, робітниками, студентами."

title: "Дума над вогнем"
subtitle: "Поезії"
kind: "poetry"
order: 5
year: 1968
description: "До нової збірки поезій відомого поета Миколи Сома увійшли кращі вірші з попередніх його книжок, а також нові твори. Віршам Сома властивий громадянський пафос, ліризм, ласкавий народний гумор."

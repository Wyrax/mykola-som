title: "Придибенції"
subtitle: "Спогади, історії, придибенції"
kind: "prose"
order: 10
year: 2009
description: "Для мене особисто книжка «Придибенції», їй-право, незвичайна і важлива. Я писав її усе життя. Не писав — записував, бо є тут речі власні і підслухані, комічні і серйозні (зі «Слова до друзів»)."

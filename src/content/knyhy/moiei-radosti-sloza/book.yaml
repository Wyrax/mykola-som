title: "Моєї радості сльоза"
subtitle: "Поезії"
kind: "poetry"
order: 7
year: 1990
description: "В новій збірці Микола Сом виявив талант пристрасного полеміста і лірика. Інколи його твори приправлені немалою дозою іронії та сарказму, того своєрідного гумору, що й раніше сприяв популярності поета серед широкої громадськості."

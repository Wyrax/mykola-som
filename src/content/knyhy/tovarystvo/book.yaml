title: "Товариство"
subtitle: "Вибране"
kind: "poetry"
order: 16
year: 1979
description: "Вибране відомого українського поета складається з віршів про воєнні роки дитинства, про видатних діячів культури, про природу й кохання. Окремий розділ становлять гумористичні твори й пісні."

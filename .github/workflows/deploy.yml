# Збирає сайт і публікує його на GitHub Pages після кожного push у main.
# У налаштуваннях репозиторію: Settings → Pages → Source: GitHub Actions.
name: Публікація на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Встановлює залежності, виконує `npm run build` (Astro + індекс пошуку Pagefind)
      # і завантажує dist/ як артефакт для Pages.
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
